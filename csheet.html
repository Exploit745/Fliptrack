<style>
  :root {
    /* Obsidian Glass Color System */
    --bg-base: #0B0E14;
    --glass-bg: rgba(255, 255, 255, 0.02);
    --glass-hover: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.08);
    
    --accent-blue: #60A5FA;
    --accent-purple: #A78BFA;
    --accent-glow: rgba(96, 165, 250, 0.2);
    
    --text-main: #F8FAFC;
    --text-muted: #94A3B8;
    
    --success: #34D399;
    --warning: #FBBF24;
    --danger: #F87171;

    --shadow: 0 16px 40px rgba(0,0,0,0.4);
    --blur: blur(16px);
  }

  * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }

  body { 
    margin: 0; 
    background-color: var(--bg-base);
    background-image: 
      radial-gradient(circle at 15% 0%, rgba(167, 139, 250, 0.05), transparent 35%),
      radial-gradient(circle at 85% 100%, rgba(96, 165, 250, 0.05), transparent 35%);
    background-attachment: fixed;
    color: var(--text-main); 
    font-size: 14px;
    line-height: 1.5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HEADER */
  header { 
    display: flex; justify-content: space-between; align-items: center; 
    padding: 20px 24px; border-bottom: 1px solid var(--glass-border);
    background: rgba(11, 14, 20, 0.8); backdrop-filter: var(--blur); z-index: 100;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .logo { width: 40px; height: 40px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 10px; display: grid; place-items: center; color: var(--accent-blue); font-size: 1.2rem; font-weight: 900; box-shadow: var(--shadow); }
  h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  small { color: var(--text-muted); font-size: 12px; font-weight: 500; }

  .nav-btn, button { 
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-main); 
    padding: 8px 14px; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; 
    font-weight: 500; font-size: 13px; text-decoration: none; font-family: inherit;
  }
  .nav-btn:hover, button:hover { background: var(--glass-hover); border-color: var(--accent-blue); box-shadow: 0 0 15px var(--accent-glow); }

  .primary { 
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); 
    color: #000; border: none; font-weight: 700; 
  }
  .primary:hover { 
    background: linear-gradient(135deg, #7db3fa, #b8a1fa);
    box-shadow: 0 0 20px rgba(167, 139, 250, 0.3); transform: translateY(-1px); border: none;
  }

  /* TOOLBAR */
  .toolbar {
    display: flex; gap: 12px; padding: 16px 24px; border-bottom: 1px solid var(--glass-border);
    background: rgba(0,0,0,0.2); align-items: center; flex-wrap: wrap;
  }
  input, select { 
    background: rgba(0,0,0,0.3); color: var(--text-main); 
    border: 1px solid var(--glass-border); border-radius: 8px; 
    padding: 10px 14px; outline: none; font-size: 13px; transition: all 0.2s; font-family: inherit;
  }
  input:focus, select:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 2px var(--accent-glow); background: rgba(0,0,0,0.5); }
  .search-bar { flex-grow: 1; max-width: 400px; }
  
  .legend { display: flex; gap: 16px; font-size: 12px; font-weight: 600; margin-left: auto; align-items: center; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.hot { background: var(--success); box-shadow: 0 0 8px var(--success); }
  .dot.warm { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
  .dot.cold { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

  /* MAIN LAYOUT */
  .main-content {
    display: flex; flex-grow: 1; overflow: hidden;
  }

  /* SIDEBAR */
  .sidebar {
    width: 240px; min-width: 240px; border-right: 1px solid var(--glass-border);
    background: rgba(0,0,0,0.2); overflow-y: auto; padding: 16px 0;
  }
  .brand-btn {
    width: 100%; text-align: left; background: transparent; border: none;
    color: var(--text-muted); padding: 10px 24px; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; border-radius: 0;
  }
  .brand-btn:hover { color: var(--text-main); background: var(--glass-hover); box-shadow: none; border-color: transparent;}
  .brand-btn.active {
    color: var(--accent-blue); background: rgba(96, 165, 250, 0.08);
    border-right: 3px solid var(--accent-blue); font-weight: 700;
  }
  .brand-count { font-size: 11px; background: rgba(255,255,255,0.05); padding: 2px 6px; border-radius: 4px; }

  /* TABLE CONTAINER */
  .table-container {
    flex-grow: 1; overflow: auto; position: relative;
    background: var(--glass-bg);
  }

  table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: center; font-size: 13px; }
  
  th, td { 
    padding: 12px 8px; border-bottom: 1px solid rgba(255,255,255,0.03); 
    border-right: 1px solid rgba(255,255,255,0.03); white-space: nowrap;
  }
  
  thead th { 
    background: rgba(11, 14, 20, 0.95); backdrop-filter: var(--blur);
    color: var(--text-muted); font-size: 11px; text-transform: uppercase; 
    letter-spacing: 0.05em; font-weight: 700; position: sticky; top: 0; z-index: 10;
    cursor: pointer; user-select: none; transition: color 0.2s;
  }
  thead th:hover { color: var(--text-main); }
  
  /* Sticky First Columns */
  thead th:nth-child(1), tbody td:nth-child(1) { position: sticky; left: 0; z-index: 20; background: rgba(11, 14, 20, 0.95); text-align: left; font-weight: 600; padding-left: 24px; box-shadow: 2px 0 5px rgba(0,0,0,0.2); }
  thead th:nth-child(2), tbody td:nth-child(2) { position: sticky; left: 200px; z-index: 20; background: rgba(11, 14, 20, 0.95); color: var(--text-muted); box-shadow: 2px 0 5px rgba(0,0,0,0.2); }
  thead th:nth-child(1), thead th:nth-child(2) { z-index: 30; } 

  td:nth-child(1) { width: 200px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
  
  .col-overall { font-weight: 800; border-right: 2px solid var(--glass-border) !important; }

  /* STR Color Coding Cells */
  .str-hot { color: var(--success); background: rgba(52, 211, 153, 0.08); font-weight: 700; }
  .str-warm { color: var(--warning); background: rgba(251, 191, 36, 0.08); font-weight: 600; }
  .str-cold { color: var(--danger); background: rgba(248, 113, 113, 0.08); font-weight: 500; }
  .str-null { color: var(--text-muted); background: transparent; }

  table tr:hover td { filter: brightness(1.2); }

  /* Sub-Header specific styling (for Letter Sizes) */
  tbody .sub-header th {
    position: static;
    color: var(--accent-blue);
    background: rgba(11, 14, 20, 0.95);
    border-top: 1px solid var(--glass-border);
    border-bottom: 1px solid var(--glass-border);
    font-weight: 800;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
  }
  tbody .sub-header th:nth-child(1) { position: sticky; left: 0; z-index: 20; text-align: left; padding-left: 24px; }
  tbody .sub-header th:nth-child(2) { position: sticky; left: 200px; z-index: 20; }

  /* Custom Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-base); }
  ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

  /* MODALS */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; padding: 18px; z-index: 1000; }
  .modal-overlay.active { display: flex; }
  .modal { width: min(760px, 100%); max-height: 92vh; overflow-y: auto; background: rgba(11, 14, 20, 0.85); border: 1px solid var(--glass-border); border-radius: 20px; padding: 32px; box-shadow: var(--shadow); backdrop-filter: var(--blur); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--glass-border); padding-bottom: 16px; }
  .modal-header h2 { margin: 0; font-size: 20px; font-weight: 700; color: var(--text-main); }
  .close-btn { background: transparent; border: none; color: var(--text-muted); font-size: 28px; cursor: pointer; padding: 0; line-height: 1; }
  .close-btn:hover { color: var(--text-main); background: transparent; box-shadow: none; border: none; }
  
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .form-group { display: flex; flex-direction: column; gap: 8px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--glass-border); }

  .size-inputs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; margin-top: 10px; }
  .size-inputs-grid div { display: flex; flex-direction: column; gap: 4px; align-items: center;}
  .size-inputs-grid label { font-size: 11px; color: var(--accent-blue); text-align: center; }
  .size-inputs-grid input { width: 100%; text-align: center; padding: 8px; }
  
  #letterSizeContainer { display: none; } /* Hidden by default */
</style>

  <header>

        <small>Sell-Through Rate (STR)</small>

        </thead>
        <tbody id="tableBody">

    </div>

  </div>

        <h2>Add Database Entry</h2>
        <button class="close-btn" onclick="closeAddModal()">&times;</button>
      </div>

        <div class="form-grid">
          <div class="form-group">
            <label>Brand Name</label>
            <input type="text" id="newBrand" required placeholder="e.g. Patagonia">

          </div>
          <div class="form-group">
            <label>Overall STR (%)</label>
            <input type="number" id="newOverall" required placeholder="e.g. 85" min="0">
          </div>
          <div class="form-group full">
            <label>Sizing Type</label>
            <select id="newType" onchange="toggleSizeInputs()">
              <option value="waist">Waist Sizes (Pants/Shorts)</option>
              <option value="letter">Letter Sizes (Tops/Jackets)</option>
            </select>
          </div>

          <!-- Waist Size Inputs -->

            <label>Size STR % (Leave blank if N/A)</label>
            <div class="size-inputs-grid">
              <div><label>28</label><input type="number" id="w_28" min="0"></div>
              <div><label>29</label><input type="number" id="w_29" min="0"></div>
              <div><label>30</label><input type="number" id="w_30" min="0"></div>

              <div><label>34</label><input type="number" id="w_34" min="0"></div>
              <div><label>35</label><input type="number" id="w_35" min="0"></div>
              <div><label>36</label><input type="number" id="w_36" min="0"></div>
              <div><label>38</label><input type="number" id="w_38" min="0"></div>
              <div><label>40</label><input type="number" id="w_40" min="0"></div>
              <div><label>42</label><input type="number" id="w_42" min="0"></div>
            </div>
          </div>

          <!-- Letter Size Inputs -->
          <div class="form-group full" id="letterSizeContainer">
            <label>Size STR % (Leave blank if N/A)</label>
            <div class="size-inputs-grid">
              <div><label>XS</label><input type="number" id="l_XS" min="0"></div>

              <div><label>3XL</label><input type="number" id="l_3XL" min="0"></div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" onclick="closeAddModal()">Cancel</button>
          <button type="submit" class="primary">Save Entry</button>
        </div>
      </form>
    </div>
  </div>

  let globalDatabase = JSON.parse(JSON.stringify(baseDatabase));
  const sizeColsWaist = [28, 29, 30, 31, 32, 33, 34, 35, 36, 38, 40, 42];

  let currentBrand = "Modern Levi's";
  let sortConfig = { key: 'model', desc: false };

  // --- ASYNC LOAD FIREBASE DATA ---
  async function loadCustomStrData() {
    try {
      const querySnapshot = await getDocs(collection(db, "fliptrack_csheet"));
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        if (!globalDatabase[data.brand]) {
          globalDatabase[data.brand] = [];
        }
        const existingIdx = globalDatabase[data.brand].findIndex(m => m.model === data.model);
        if (existingIdx > -1) {
          globalDatabase[data.brand][existingIdx] = data;
        } else {
          globalDatabase[data.brand].push(data);
        }
      });
      renderSidebar();
      renderTable();
    } catch (e) {
      console.error("Failed to fetch custom STR data:", e);
    }
  }

  // --- EXPOSE GLOBALS ---
  window.openAddModal = function() {
    document.getElementById('strForm').reset();
    document.getElementById('addStrModal').classList.add('active');
    toggleSizeInputs();
  };
  
  window.closeAddModal = function() {
    document.getElementById('addStrModal').classList.remove('active');
  };

  window.toggleSizeInputs = function() {
    const type = document.getElementById('newType').value;
    if (type === 'waist') {
      document.getElementById('waistSizeContainer').style.display = 'block';
      document.getElementById('letterSizeContainer').style.display = 'none';
    } else {
      document.getElementById('waistSizeContainer').style.display = 'none';
      document.getElementById('letterSizeContainer').style.display = 'block';
    }
  };

  window.handleStrSubmit = async function(e) {
    e.preventDefault();
    const brand = document.getElementById('newBrand').value.trim();
    const model = document.getElementById('newModel').value.trim();
    const type = document.getElementById('newType').value;
    const avgPrice = document.getElementById('newAvgPrice').value.trim();
    const overall = parseInt(document.getElementById('newOverall').value) || 0;
    
    let sizes = {};
    if (type === 'waist') {
      sizeColsWaist.forEach(s => {
        const val = document.getElementById(`w_${s}`).value;
        sizes[s] = val === '' ? null : parseInt(val);
      });
    } else {
      sizeColsLetter.forEach(s => {
        const val = document.getElementById(`l_${s}`).value;
        sizes[s] = val === '' ? null : parseInt(val);
      });
    }

    const docId = `${brand}_${model}`.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
    const dataObj = { brand, model, type, avgPrice, overall, sizes };

    try {
      await setDoc(doc(db, "fliptrack_csheet", docId), dataObj);
      
      // Update local state to avoid forced refresh
      if (!globalDatabase[brand]) globalDatabase[brand] = [];
      const existingIdx = globalDatabase[brand].findIndex(m => m.model === model);
      if (existingIdx > -1) globalDatabase[brand][existingIdx] = dataObj;
      else globalDatabase[brand].push(dataObj);

      currentBrand = brand;
      renderSidebar();
      renderTable();
      closeAddModal();
    } catch (error) {
      console.error("Failed to save entry: ", error);
      alert("Failed to save to database.");
    }
  };

  window.renderSidebar = function() {
    const sidebar = document.getElementById('sidebar');
    sidebar.innerHTML = '';
    
    // Sort brands alphabetically but keep Modern Levi's on top if preferred
    const brands = Object.keys(globalDatabase).sort();
    
    brands.forEach(brand => {
      const count = globalDatabase[brand].length;
      const btn = document.createElement('button');
      btn.className = `brand-btn ${brand === currentBrand ? 'active' : ''}`;
      btn.innerHTML = `<span>${brand}</span> <span class="brand-count">${count}</span>`;
      btn.onclick = () => {
        currentBrand = brand;
        document.getElementById('searchBar').value = ''; 
        window.renderSidebar(); 
        window.renderTable();
      };
      sidebar.appendChild(btn);
    });
  }

  function getStrClass(val) {
    if (val === null || val === undefined || val === '') return 'str-null';
    if (val >= 50) return 'str-hot';
    if (val >= 30) return 'str-warm';
    return 'str-cold';
  }

  function formatStr(val) {
    return (val === null || val === undefined || val === '') ? '-' : `${val}%`;
  }

  window.handleSort = function(key) {
    if (sortConfig.key === key) {
      sortConfig.desc = !sortConfig.desc; 
    } else {
      sortConfig.key = key;
      sortConfig.desc = true; 
    }
    window.renderTable();
  }

  window.renderTable = function() {
    const tbody = document.getElementById('tableBody');
    const searchQuery = document.getElementById('searchBar').value.toLowerCase();
    const minStr = parseInt(document.getElementById('minStrFilter').value) || 0;
    
    tbody.innerHTML = '';

    if (!globalDatabase[currentBrand]) return;

    let data = [...globalDatabase[currentBrand]];

    // Filter
    data = data.filter(item => {
      const matchesSearch = item.model.toLowerCase().includes(searchQuery);
      const matchesStr = item.overall >= minStr;
      return matchesSearch && matchesStr;
    });

    // Sort
    data.sort((a, b) => {
      let valA, valB;
      if (sortConfig.key === 'model') {
        valA = a.model.toLowerCase(); valB = b.model.toLowerCase();
      } else if (sortConfig.key === 'avgPrice') {
        valA = parseInt(a.avgPrice.replace(/[^0-9]/g, '')) || 0;
        valB = parseInt(b.avgPrice.replace(/[^0-9]/g, '')) || 0;
      } else if (sortConfig.key === 'overall') {
        valA = a.overall; valB = b.overall;
      } else {
        valA = a.sizes[sortConfig.key] || 0; valB = b.sizes[sortConfig.key] || 0;
      }
      if (valA < valB) return sortConfig.desc ? 1 : -1;
      if (valA > valB) return sortConfig.desc ? -1 : 1;
      return 0;
    });

    const waistData = data.filter(d => d.type === 'waist' || !d.type);
    const letterData = data.filter(d => d.type === 'letter');
    let html = '';

    if (waistData.length > 0) {
      waistData.forEach(item => {
        let rowHtml = `
          <td style="text-align:left; padding-left:24px;">${item.model}</td>
          <td>${item.avgPrice}</td>
          <td class="col-overall ${getStrClass(item.overall)}">${formatStr(item.overall)}</td>
        `;
        sizeColsWaist.forEach(size => {
          const val = item.sizes[size];
          rowHtml += `<td class="${getStrClass(val)}">${formatStr(val)}</td>`;
        });
        html += `<tr>${rowHtml}</tr>`;
      });
    }

    if (letterData.length > 0) {
      html += `
        <tr class="sub-header">
          <th>Letter Size Models</th>
          <th>AVG $</th>
          <th class="col-overall">Overall STR</th>
          <th>XS</th><th>S</th><th>M</th><th>L</th><th>XL</th><th>2XL</th><th>3XL</th>
          <th colspan="5"></th>
        </tr>
      `;
      letterData.forEach(item => {
        let rowHtml = `
          <td style="text-align:left; padding-left:24px;">${item.model}</td>
          <td>${item.avgPrice}</td>
          <td class="col-overall ${getStrClass(item.overall)}">${formatStr(item.overall)}</td>
        `;
        sizeColsLetter.forEach(size => {
          const val = item.sizes[size];
          rowHtml += `<td class="${getStrClass(val)}">${formatStr(val)}</td>`;
        });
        rowHtml += `<td colspan="5"></td>`;
        html += `<tr>${rowHtml}</tr>`;
      });
    }

    if (html === '') {
      html = `<tr><td colspan="${3 + sizeColsWaist.length}" style="padding: 40px; color: var(--text-muted);">No models match your criteria.</td></tr>`;
    }

    tbody.innerHTML = html;
  }

  // Init
  window.renderSidebar();
  window.renderTable();
  loadCustomStrData(); // Mount Firebase changes
